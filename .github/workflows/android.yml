name: Android APK

# Compila el APK debug en la nube: no hace falta Android Studio local.
# El artefacto queda en el run de Actions para descargar e instalar a mano.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "android/**"
      - "capacitor.config.ts"
      - "src/lib/print/**"
      - "src/lib/native/**"
      - ".github/workflows/android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Instala los paquetes del SDK y deja sdkmanager en el PATH. Se listan
      # explícitos (sin el paquete obsoleto 'tools', que rompía el default).
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Instalar dependencias
        run: bun install

      - name: Capacitor sync
        run: bunx cap sync android

      - name: Compilar APK debug
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: totempoint-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
